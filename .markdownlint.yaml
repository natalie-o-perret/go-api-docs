default: true

# Headings must use ATX style (# Heading).
MD003:
  style: atx

# Line-length: disabled — Markdown tables cannot reasonably stay under 80
# characters and wrapping them would destroy readability.
MD013: false

# Duplicate headings: allow the same heading text in different sections of the
# document (e.g. "Framework adapters" appears under different parent headings).
MD024:
  siblings_only: true

# Trailing punctuation in headings: disabled — several headings intentionally
# end with a colon or question mark for readability.
MD026: false

# Fenced-code-language: disabled — some illustrative blocks deliberately omit
# a language tag (e.g. import-path listings).
MD040: false

