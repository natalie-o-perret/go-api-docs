version: "2"

linters:
  # start with the default set and add a few extras
  default: standard
  enable:
    - errcheck        # unchecked error returns
    - staticcheck     # SA*, S*, QF* checks (incl. deprecated API + gosimple)
    - unused          # unexported identifiers that are never used
    - ineffassign     # assignments whose value is never used
    - govet           # go vet checks

linters:
  settings:
    errcheck:
      # Ignore errors from common "fire and forget" patterns.
      ignore: "fmt:.*,io/fs:PathError"

issues:
  # Treat every finding as an error — zero warnings policy.
  max-issues-per-linter: 0
  max-same-issues: 0

