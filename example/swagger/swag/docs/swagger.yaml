basePath: /
definitions:
  main.ErrorResponse:
    properties:
      code:
        example: not_found
        type: string
      message:
        example: task not found
        type: string
    type: object
  main.Task:
    properties:
      createdAt:
        example: "2026-04-25T10:00:00Z"
        format: date-time
        type: string
      id:
        example: task_1
        type: string
      status:
        enum:
          - open
          - in_progress
          - done
        example: open
        type: string
      title:
        example: Design onboarding
        type: string
    type: object
  main.TaskInput:
    properties:
      status:
        enum:
          - open
          - in_progress
          - done
        example: open
        type: string
      title:
        example: My new task
        type: string
    required:
      - title
    type: object
host: localhost:9082
info:
  contact: {}
  description: A simple task-management service — swagger/swag example.
  title: Tasks API
  version: 2.0.0
paths:
  /tasks:
    get:
      parameters:
        - description: Filter by status
          enum:
            - open
            - in_progress
            - done
          in: query
          name: status
          type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Task'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
        - BearerAuth: []
      summary: List tasks
      tags:
        - tasks
    post:
      consumes:
        - application/json
      parameters:
        - description: Task to create
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/main.TaskInput'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
        - BearerAuth: []
      summary: Create a task
      tags:
        - tasks
  /tasks/{id}:
    delete:
      parameters:
        - description: Task ID
          in: path
          name: id
          required: true
          type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
        - BearerAuth: []
      summary: Delete a task
      tags:
        - tasks
    get:
      parameters:
        - description: Task ID
          in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Task'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
        - BearerAuth: []
      summary: Get a task
      tags:
        - tasks
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
