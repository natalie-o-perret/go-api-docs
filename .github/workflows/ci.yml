name: ci - build + tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: download deps
        run: go mod download

      - name: vet
        run: go vet ./openapi ./ui/... ./cmd/...

      - name: test
        if: runner.os != 'Linux'
        run: go test -race -count=1 ./openapi ./ui/... ./cmd/...

      - name: test with coverage
        if: runner.os == 'Linux'
        run: go test -race -count=1 -coverprofile=coverage.out ./openapi ./ui/... ./cmd/...

      - name: build root-module examples
        run: go test ./examples/ui/... ./examples/openapi/goapi-gen

      - name: coverage gate (>= 45%)
        if: runner.os == 'Linux'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 45) { print "Coverage " t "% is below 45% threshold"; exit 1 } }'

      - name: upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: run govulncheck
        run: govulncheck ./openapi ./ui/... ./cmd/...

  examples:
    name: example (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chi
            directory: examples/openapi/chi
          - name: echo
            directory: examples/openapi/echo
          - name: fiber
            directory: examples/openapi/fiber
          - name: gin
            directory: examples/openapi/gin
          - name: gorilla
            directory: examples/openapi/gorilla
          - name: httprouter
            directory: examples/openapi/httprouter
          - name: stdhttp
            directory: examples/openapi/stdhttp
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - run: go test ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  compatibility:
    name: test (Go 1.26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          check-latest: true
      - run: go test -race -count=1 ./...
