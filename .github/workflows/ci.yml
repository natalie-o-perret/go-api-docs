name: ci - build + tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: download deps
        run: go mod download

      - name: vet
        run: go vet ./openapi ./ui/... ./cmd/...

      - name: test
        if: runner.os != 'Linux'
        run: go test -race -count=1 ./openapi ./ui/... ./cmd/...

      - name: test with coverage
        if: runner.os == 'Linux'
        run: go test -race -count=1 -coverprofile=coverage.out ./openapi ./ui/... ./cmd/...

      - name: build root-module examples
        run: go test ./examples/ui/... ./examples/openapi/goapi-gen

      - name: coverage gate (>= 45%)
        if: runner.os == 'Linux'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 45) { print "Coverage " t "% is below 45% threshold"; exit 1 } }'

      - name: upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: run govulncheck
        run: govulncheck ./openapi ./ui/... ./cmd/...

  examples:
    name: example (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chi
            directory: examples/openapi/chi
          - name: echo
            directory: examples/openapi/echo
          - name: fiber
            directory: examples/openapi/fiber
          - name: gin
            directory: examples/openapi/gin
          - name: gorilla
            directory: examples/openapi/gorilla
          - name: httprouter
            directory: examples/openapi/httprouter
          - name: stdhttp
            directory: examples/openapi/stdhttp
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache: false

      - run: go test ./...
