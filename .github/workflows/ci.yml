name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: download deps
        run: go mod download

      - name: vet
        run: go vet $(go list ./... | grep -v '/example')
        if: runner.os != 'Windows'

      - name: vet (windows)
        run: |
          $packages = go list ./... | Where-Object { $_ -notlike '*/example*' }
          go vet $packages
        shell: pwsh
        if: runner.os == 'Windows'

      - name: test
        run: go test -race -count=1 $(go list ./... | grep -v '/example')
        if: runner.os != 'Windows'

      - name: test (windows)
        run: |
          $packages = go list ./... | Where-Object { $_ -notlike '*/example*' }
          go test -race -count=1 $packages
        shell: pwsh
        if: runner.os == 'Windows'

  deadcode:
    name: deadcode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest

      - name: check dead code
        run: deadcode $(go list ./... | grep -v '/example')

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: check warnings
        run: staticcheck $(go list ./... | grep -v '/example')

