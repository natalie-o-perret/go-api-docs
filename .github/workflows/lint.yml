name: ci - lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  lint:
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint.yml@750bb5803e7e5fa312be6871b97ef016a6e61676
    permissions:
      pull-requests: read
